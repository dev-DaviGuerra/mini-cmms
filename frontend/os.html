<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ordens de serviço · MaintOS</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preload" href="fontes/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fontes/ibm-plex-mono-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/estilo.css">
  <script type="module" src="js/os-lista.js"></script>
</head>
<body class="app">
  <aside id="menu" class="menu-lateral" aria-label="Menu principal"></aside>

  <main class="conteudo" id="conteudo">
    <header class="cabecalho-pagina">
      <h1>Ordens de serviço</h1>
      <button id="botao-nova" type="button" class="botao primario" hidden
              aria-haspopup="dialog" aria-controls="drawer-nova">+ Nova OS</button>
    </header>

    <!-- Faixa de indicadores (GET /api/kpis/resumo). Os 3 primeiros filtram a lista. -->
    <section class="indicadores" aria-label="Indicadores">
      <button type="button" class="indicador aberta" data-status="ABERTA" aria-pressed="false">
        <span class="indicador-rotulo status aberta">Abertas</span>
        <span class="indicador-valor" id="kpi-abertas"><span class="skeleton valor"></span></span>
        <span class="indicador-dica">aguardando técnico</span>
      </button>
      <button type="button" class="indicador em-andamento" data-status="EM_ANDAMENTO" aria-pressed="false">
        <span class="indicador-rotulo status em-andamento">Em andamento</span>
        <span class="indicador-valor" id="kpi-andamento"><span class="skeleton valor"></span></span>
        <span class="indicador-dica">em execução</span>
      </button>
      <button type="button" class="indicador aguardando-peca" data-status="AGUARDANDO_PECA" aria-pressed="false">
        <span class="indicador-rotulo status aguardando-peca">Aguardando peça</span>
        <span class="indicador-valor" id="kpi-aguardando"><span class="skeleton valor"></span></span>
        <span class="indicador-dica">sem estoque no fechamento</span>
      </button>
      <!-- indicador mais crítico: cor de alerta própria e destaque quando > 0 -->
      <div class="indicador parados" id="card-parados">
        <span class="indicador-rotulo status critico">Máquinas paradas</span>
        <span class="indicador-valor" id="kpi-parados"><span class="skeleton valor"></span></span>
        <span class="indicador-dica">equipamentos com OS pendente</span>
      </div>
    </section>

    <div id="mensagem" role="status" hidden></div>

    <section class="painel" aria-labelledby="titulo-lista">
      <h2 id="titulo-lista" class="so-leitor-de-tela">Lista de ordens de serviço</h2>
      <div class="painel-cabecalho">
        <form id="filtros" class="filtros" novalidate>
          <div class="campo">
            <label for="filtro-status">Status</label>
            <select id="filtro-status" name="status"><option value="">Todos</option></select>
          </div>
          <div class="campo">
            <label for="filtro-prioridade">Prioridade</label>
            <select id="filtro-prioridade" name="prioridade"><option value="">Todas</option></select>
          </div>
          <div class="campo largo">
            <label for="filtro-equipamento">Equipamento</label>
            <select id="filtro-equipamento" name="equipamentoId"><option value="">Todos</option></select>
          </div>
          <div class="filtros-acoes">
            <button type="button" id="botao-limpar" class="botao secundario">Limpar</button>
            <button type="button" id="botao-atualizar" class="botao secundario">Atualizar</button>
          </div>
        </form>
      </div>

      <div class="tabela-rolagem">
        <table class="tabela">
          <thead>
            <tr>
              <th scope="col">OS</th>
              <th scope="col">Equipamento</th>
              <th scope="col" class="col-descricao">Descrição</th>
              <th scope="col">Tipo</th>
              <th scope="col">Prioridade</th>
              <th scope="col">Status</th>
              <th scope="col">Aberta em</th>
              <th scope="col">Técnico</th>
            </tr>
          </thead>
          <tbody id="linhas"></tbody>
        </table>
      </div>

      <div class="rodape-tabela">
        <span id="info-paginacao" aria-live="polite"></span>
        <div class="paginacao-botoes">
          <button type="button" id="botao-anterior" class="botao secundario">‹ Anterior</button>
          <button type="button" id="botao-proxima" class="botao secundario">Próxima ›</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Drawer "Nova OS": só OPERADOR e SUPERVISOR veem o botão (a API também valida o perfil) -->
  <aside id="drawer-nova" class="drawer" role="dialog" aria-modal="true" aria-labelledby="titulo-nova" inert>
    <form id="form-nova" novalidate class="drawer-form">
      <div class="drawer-cabecalho">
        <h2 id="titulo-nova">Abrir ordem de serviço</h2>
        <button type="button" class="botao secundario icone" data-fechar-drawer aria-label="Fechar">×</button>
      </div>
      <div class="drawer-corpo">
        <div id="mensagem-nova" role="alert" hidden></div>
        <div class="campo">
          <label for="nova-equipamento">Equipamento</label>
          <select id="nova-equipamento" name="equipamentoId" required>
            <option value="">Selecione…</option>
          </select>
          <span class="ajuda">Ao abrir a OS, o equipamento passa para PARADO.</span>
        </div>
        <div class="linha-campos">
          <div class="campo">
            <label for="nova-tipo">Tipo</label>
            <select id="nova-tipo" name="tipo"></select>
          </div>
          <div class="campo">
            <label for="nova-prioridade">Prioridade</label>
            <select id="nova-prioridade" name="prioridade"></select>
          </div>
        </div>
        <div class="campo">
          <label for="nova-descricao">Descrição da falha</label>
          <textarea id="nova-descricao" name="descricao" rows="5" maxlength="1000" required
                    placeholder="Ex.: Robô parou com alarme de sobrecorrente no eixo 3"></textarea>
          <span class="ajuda">Mínimo de 5 caracteres.</span>
        </div>
      </div>
      <div class="drawer-rodape">
        <button type="button" class="botao secundario" data-fechar-drawer>Cancelar</button>
        <button type="submit" class="botao primario">Abrir OS</button>
      </div>
    </form>
  </aside>
  <div id="fundo-drawer" class="fundo-drawer" data-fechar-drawer></div>
</body>
</html>
