# Análise do SonarCloud feita pela CI (.github/workflows/ci.yml), e não pela
# "Automatic Analysis": só pela CI dá para enviar o relatório de cobertura.
sonar.projectKey=dev-DaviGuerra_mini-cmms
sonar.organization=dev-daviguerra
sonar.projectName=mini-cmms

# Com o novo escopo de análise do SonarCloud, sonar.sources/sonar.tests não têm efeito:
# o projeto inteiro é analisado, e o escopo é ajustado só pelas exclusões abaixo.
sonar.sourceEncoding=UTF-8

# Fora da análise:
# - código de terceiros e artefatos gerados (node_modules, coverage, vendor, fontes);
# - os scripts SQL (database/**/*.sql). O SonarCloud não tem analisador de PostgreSQL: ele
#   lê arquivos .sql como PL/SQL do Oracle. Na main isso gerava o aviso de análise "The Data
#   Dictionary is not configured for the PLSQL analyzer" (o analisador pede uma conexão com
#   um banco Oracle) e 16 erros de parse em 02_triggers.sql e 03_procedures.sql (sintaxe do
#   PostgreSQL). As regras dele são do Oracle; a única que apontou algo (plsql:CharVarchar,
#   "use VARCHAR2") era falso positivo. O SQL é validado de outro jeito: a CI aplica os
#   scripts num PostgreSQL 18 real e roda o 04_consultas_bd2.sql no psql, e os testes da API
#   exercitam as triggers, a função e a procedure.
# - imagens (**/*.png, **/*.webp): capturas de tela e afins não são código; o scanner tentava lê-las como
#   texto e registrava "Invalid character encountered" em cada PNG de docs/capturas.
sonar.exclusions=**/node_modules/**,**/coverage/**,frontend/vendor/**,frontend/fontes/**,database/**/*.sql,**/*.png,**/*.webp

# Cobertura: relatório lcov do c8 (npm run test:cobertura).
# O front (testado no navegador, com Edge headless) e o seed (script de carga) não têm
# testes automatizados de unidade: continuam analisados para bugs e vulnerabilidades,
# mas ficam fora da métrica de cobertura. Os próprios testes (backend/tests) também.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.coverage.exclusions=frontend/**,database/**,backend/tests/**
