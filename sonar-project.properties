# Análise do SonarCloud feita pela CI (.github/workflows/ci.yml), e não pela
# "Automatic Analysis": só pela CI dá para enviar o relatório de cobertura.
sonar.projectKey=dev-DaviGuerra_mini-cmms
sonar.organization=dev-daviguerra
sonar.projectName=mini-cmms

sonar.sources=backend/src,frontend,database
sonar.tests=backend/tests
sonar.sourceEncoding=UTF-8

# Código de terceiros e artefatos gerados não entram na análise
sonar.exclusions=**/node_modules/**,**/coverage/**,frontend/vendor/**,frontend/fontes/**

# Cobertura: relatório lcov do c8 (npm run test:cobertura).
# O front (testado no navegador, com Edge headless) e o seed (script de carga) não têm
# testes automatizados de unidade: continuam analisados para bugs e vulnerabilidades,
# mas ficam fora da métrica de cobertura.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.coverage.exclusions=frontend/**,database/**

# Falso positivo: plsql:CharVarchar é regra do Oracle ("use VARCHAR2"). O projeto é
# PostgreSQL, que não tem VARCHAR2; CHAR(1) com CHECK ('A','B','C') é o tipo correto.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:CharVarchar
sonar.issue.ignore.multicriteria.e1.resourceKey=database/**/*.sql
